name: Nova Bank Payments Security
run-name: >-
  ${{ github.event_name == 'pull_request' && 'Nova Bank Payments — Pull request scan' ||
      github.ref_name == 'main' && 'Nova Bank Payments — Test and monitor' ||
      'Nova Bank Payments — Branch scan' }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SNYK_CLI_VERSION: '1.1309.0'

jobs:
  # Nova Bank demo: report high and critical findings on PRs and main.
  snyk-test:
    name: snyk test (security gate)
    runs-on: ubuntu-latest
    outputs:
      scan-completed: ${{ steps.test.outputs.scan-completed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install Snyk CLI
        run: npm install -g "snyk@$SNYK_CLI_VERSION"
      - name: Run snyk test
        id: test
        run: |
          status=0
          snyk test --severity-threshold=high || status=$?
          # Snyk exit codes: 0 = no issues, 1 = issues found (scan completed),
          # 2 = CLI error, 3 = no supported project. Only 0 or 1 count as a real scan.
          if [[ "$status" == 0 || "$status" == 1 ]]; then
            echo 'scan-completed=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Monitor main after a completed scan, including scans that found issues.
  snyk-monitor:
    name: snyk monitor (dashboard snapshot)
    needs: snyk-test
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.snyk-test.outputs.scan-completed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install Snyk CLI
        run: npm install -g "snyk@$SNYK_CLI_VERSION"
      - name: Run snyk monitor
        run: >
          snyk monitor
          --project-name=nova-bank/payments-api
          --project-business-criticality=critical
          --project-tags=team=payments
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
